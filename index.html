<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Home</title>
    <style>html, body { margin: 0; background: #06070b; }</style>
</head>
<body>
    <div id="header">
        <div id="clock">--:--</div>
        <div id="date"></div>
    </div>

    <div id="rows"></div>

    <div id="toast"></div>
    <div id="status"></div>

    <!--
      Bootstrap. This file should rarely change.
      TizenBrew serves the module through jsDelivr's "latest on branch" URLs,
      which can stay stale for hours after a push. So the real CSS and JS are
      loaded from a commit-pinned jsDelivr URL instead (those never go stale):
        1. start at once from the commit remembered from last time;
        2. ask GitHub which commit is newest, and reload if it changed.
      With no remembered commit and no answer from GitHub, fall back to the
      files next to this page.
    -->
    <script>
    (function () {
        var REPO = 'Atlas101320/tv-launcher';
        var KEY = 'home-launcher-sha';
        var started = false;

        function saved() {
            try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; }
        }

        function addScript(src, done) {
            var s = document.createElement('script');
            s.src = src;
            s.onload = done;
            s.onerror = done;
            document.body.appendChild(s);
        }

        function boot(sha) {
            if (started) { return; }
            started = true;
            var base = sha ? 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/' : '';
            window.HOME_VERSION = sha ? sha.substring(0, 7) : 'local';
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = base + 'css/style.css';
            document.head.appendChild(css);
            addScript(base + 'js/apps.js', function () {
                addScript(base + 'js/launcher.js', function () {});
            });
        }

        var known = saved();
        if (/^[0-9a-f]{40}$/.test(known)) { boot(known); }

        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://api.github.com/repos/' + REPO + '/commits/main', true);
        xhr.setRequestHeader('Accept', 'application/vnd.github.sha');
        xhr.timeout = 5000;
        xhr.onload = function () {
            var sha = (xhr.responseText || '').replace(/\s/g, '');
            if (xhr.status !== 200 || !/^[0-9a-f]{40}$/.test(sha)) { boot(''); return; }
            if (sha !== known) {
                try { localStorage.setItem(KEY, sha); } catch (e) { /* private mode */ }
                if (started) { location.reload(); return; }
            }
            boot(sha);
        };
        xhr.onerror = function () { boot(''); };
        xhr.ontimeout = function () { boot(''); };
        xhr.send();
    })();
    </script>
</body>
</html>
